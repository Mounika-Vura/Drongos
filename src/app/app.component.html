 <div class="container mt-4">
  <h1>Layout Generator</h1>
  <textarea class="form-control mb-3" [(ngModel)]="jsonInput" placeholder="Enter JSON data here" rows="5"></textarea>
  <button class="btn btn-primary mb-3" (click)="generateLayout()" [disabled]="isLoading">Generate Layout</button>

  <div *ngIf="isLoading" class="alert alert-info">
    Loading...
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!isLoading && !error && (htmlCode || cssCode || tsCode)">
    <ul class="nav nav-tabs d-flex justify-content-between align-items-center" id="codeTab" role="tablist">
      <div>
        <li class="nav-item d-inline-block" role="presentation">
          <button class="nav-link" [class.active]="activeTab === 'html'" (click)="setActiveTab('html')" id="html-tab" type="button" role="tab" aria-controls="html-tab-pane" aria-selected="true">HTML</button>
        </li>
        <li class="nav-item d-inline-block" role="presentation">
          <button class="nav-link" [class.active]="activeTab === 'css'" (click)="setActiveTab('css')" id="css-tab" type="button" role="tab" aria-controls="css-tab-pane" aria-selected="false">CSS</button>
        </li>
        <li class="nav-item d-inline-block" role="presentation">
          <button class="nav-link" [class.active]="activeTab === 'ts'" (click)="setActiveTab('ts')" id="ts-tab" type="button" role="tab" aria-controls="ts-tab-pane" aria-selected="false">TypeScript</button>
        </li>
      </div>
      <div>
        <button class="btn btn-secondary" style="margin-bottom: none;" (click)="copyActiveTabContent()">
          <i class="fa fa-copy"></i> Copy
        </button>
      </div>
    </ul>
    <div class="tab-content" id="codeTabContent">
      <div class="tab-pane fade" [class.show]="activeTab === 'html'" [class.active]="activeTab === 'html'" id="html-tab-pane" role="tabpanel" aria-labelledby="html-tab" tabindex="0">
        <pre class="mt-3"><code>{{ htmlCode }}</code></pre>
      </div>
      <div class="tab-pane fade" [class.show]="activeTab === 'css'" [class.active]="activeTab === 'css'" id="css-tab-pane" role="tabpanel" aria-labelledby="css-tab" tabindex="0">
        <pre class="mt-3"><code>{{ cssCode }}</code></pre>
      </div>
      <div class="tab-pane fade" [class.show]="activeTab === 'ts'" [class.active]="activeTab === 'ts'" id="ts-tab-pane" role="tabpanel" aria-labelledby="ts-tab" tabindex="0">
        <pre class="mt-3"><code>{{ tsCode }}</code></pre>
      </div>
    </div>
  </div>
  <div *ngIf="copyMessage" class="toast" style="position: fixed; bottom: 1rem; right: 1rem;">
    <div class="toast-body">
      {{ copyMessage }}
    </div>
  </div>
</div>
